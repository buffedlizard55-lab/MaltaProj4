name: Diag e009964b (non-publishing)

# Session e009964b: the scheduled publisher (pages.yml) has failed on main at
# "Build and independently verify every row, calculation and internal link"
# (run 40193317196, 2026-10-25T12:29Z). Workflow logs and artifact blobs cannot
# be downloaded from the agent sandbox, so this dispatch-only job reproduces the
# exact same sequence on a fresh Hotspawn snapshot and commits each command's
# exit code and log to this session branch, where they can be read through git.
# It never deploys, never touches main, never changes a pick.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag-e009964b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts

      - name: Refresh official sources (as the publisher does)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          set +e
          python -m scripts.refresh --output runtime/latest.json > runtime/refresh.log 2>&1
          echo "refresh_rc=$?" > runtime/diag.env
          set -e

      - name: Quarantine, independent audit, build, validate, published audit
        run: |
          set +e
          python -m scripts.quarantine runtime/latest.json > runtime/quarantine.log 2>&1
          echo "quarantine_rc=$?" >> runtime/diag.env
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/independent-row-audit.md > runtime/audit1.log 2>&1
          echo "audit_runtime_rc=$?" >> runtime/diag.env
          python -m scripts.build --data runtime/latest.json > runtime/build.log 2>&1
          echo "build_rc=$?" >> runtime/diag.env
          python -m scripts.validate --data runtime/latest.json > runtime/validate.log 2>&1
          echo "validate_rc=$?" >> runtime/diag.env
          python verification-c6/audit_snapshot.py public/data/latest.json --output runtime/published-row-audit.md > runtime/audit2.log 2>&1
          echo "audit_public_rc=$?" >> runtime/diag.env
          python -m unittest discover -s tests > runtime/unittest.log 2>&1
          echo "unittest_rc=$?" >> runtime/diag.env
          python -m scripts.validate --data data/latest.json --site . > runtime/validate_committed.log 2>&1
          echo "validate_committed_rc=$?" >> runtime/diag.env
          set -e
          cat runtime/diag.env

      - name: Commit the receipts to this session branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p research/session-e009964b
          cp -r runtime "research/session-e009964b/run-${{ github.run_id }}"
          rm -f "research/session-e009964b/run-${{ github.run_id }}/latest.json"
          git config user.name "cs2-scout-publisher"
          git config user.email "cs2-scout-publisher@users.noreply.github.com"
          git add research/session-e009964b
          git -c commit.gpgsign=false commit -q -m "Record e009964b publisher diagnostic (${{ github.run_id }})" || true
          git push origin "HEAD:${{ github.ref }}" || echo "push refused"
