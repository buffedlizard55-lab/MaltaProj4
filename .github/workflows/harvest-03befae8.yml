name: Research harvest 03befae8 (non-publishing)

# Why this exists
# ---------------
# The authoring sandbox reaches GitHub and package registries only (verified
# 2026-10-17: `python -c "requests.get('https://www.hltv.org/matches')"` ->
# SSL_ERROR_SYSCALL, and the same for play.hotspawn.com, gamma-api.polymarket.com
# and buffedlizard55-lab.github.io), so the real, unmodified refresh and the
# EGamersWorld page capture run here on a runner with normal outbound access and
# their raw responses are committed for line-by-line re-checking.
#
# This workflow never publishes to Pages and never deploys; publication stays
# with pages.yml on main. Every command's real exit status is written to a file
# because `continue-on-error` would otherwise hide a failure.

on:
  push:
    branches: [arena/03befae8-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-03befae8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/harvest-03befae8/logs runtime
      - name: EGamersWorld book-listing page capture
        continue-on-error: true
        run: python -m scripts.egw_probe --output research/harvest-03befae8/egw 2>&1 | tee research/harvest-03befae8/logs/egw-probe.txt
      - name: Real refresh of the official sources
        continue-on-error: true
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-03befae8/logs/refresh.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md 2>&1 | tee research/harvest-03befae8/logs/row-audit.txt
      - name: Copy the refreshed snapshot and audit for review
        run: |
          cp runtime/latest.json research/harvest-03befae8/snapshot.json
          if [ -s runtime/row-audit.md ]; then cp runtime/row-audit.md research/harvest-03befae8/row-audit.md; fi
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-03befae8
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest 03befae8 from run ${GITHUB_RUN_ID} (no publication) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-03befae8-${{ github.run_id }}
          path: |
            research/harvest-03befae8
            runtime/latest.json
            runtime/row-audit.md
          retention-days: 7
