name: Probe 408eb0af line-source reachability (non-publishing)

# Answers one question with dated bytes: from the only egress this project can
# reach these hosts from, which public pre-match CS2 line sources actually
# answer, and with what page shape? It reads each endpoint once, never bypasses
# a refusal, sends no credentials, writes only under
# research/session-408eb0af/probe/ and never touches data/ or the site.
on:
  push:
    branches: [arena/408eb0af-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-408eb0af
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe408]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe each endpoint once
        run: python -m scripts.probe_sources_408eb0af --output research/session-408eb0af/probe
      - name: Commit the measurement
        run: |
          git config user.name "cs2-scout-publisher"
          git config user.email "cs2-scout-publisher@users.noreply.github.com"
          git add research/session-408eb0af/probe
          if git diff --cached --quiet; then
            echo "Nothing to record."
            exit 0
          fi
          git -c commit.gpgsign=false commit -q -m "Record the 408eb0af line-source reachability probe (run ${{ github.run_id }})"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::probe commit could not be pushed"
          exit 1
