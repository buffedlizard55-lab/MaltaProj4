name: Fresh coverage harvest d2a55add (non-publishing)

# A real refresh on a normal GitHub egress (the authoring sandbox reaches
# GitHub/package registries only), followed by quarantine, the independent
# evidence replay, the per-row coverage audit, the unresolved-row ledger
# (HLTV first, then esportsbook lines, for every non-featured row), the
# production build, the validator and the phone/browser gates. Only dated
# research receipts are committed; this workflow never deploys Pages and
# never pushes a generated board directly to main. Publication stays with
# pages.yml after the integration PR merges.
on:
  push:
    branches: [arena/d2a55add-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-harvest-d2a55add
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/arena/d2a55add-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Refresh Hotspawn, Polymarket, HLTV, Pinnacle, books and Valve sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime research/harvest-d2a55add
          python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-d2a55add/refresh.log
          cp runtime/latest.json research/harvest-d2a55add/snapshot-raw.json
      - name: Quarantine any row the independent evidence replay cannot reproduce
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-d2a55add/quarantine.log
      - name: Independently audit every refreshed row and its pick coverage
        run: |
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/independent-row-audit.md
          cp runtime/independent-row-audit.md research/harvest-d2a55add/independent-row-audit.md
          python -m scripts.audit_f89bb1f8 --data runtime/latest.json 2>&1 | tee research/harvest-d2a55add/coverage-audit.log
      - name: Ledger every non-featured row (HLTV first, then esportsbook lines)
        run: python -m scripts.gap_probe_d2a55add --snapshot runtime/latest.json --output research/harvest-d2a55add 2>&1 | tee research/harvest-d2a55add/gap-probe.log
      - name: Keep the quarantined candidate snapshot beside its ledger
        run: cp runtime/latest.json research/harvest-d2a55add/snapshot.json
      - name: Build and validate the fresh candidate exactly as publication does
        run: |
          python -m scripts.build --data runtime/latest.json 2>&1 | tee research/harvest-d2a55add/build.log
          python -m scripts.validate --data runtime/latest.json 2>&1 | tee research/harvest-d2a55add/validate.log
          python verification-c6/audit_snapshot.py public/data/latest.json --output research/harvest-d2a55add/published-row-audit.md
      - name: Phone, desktop, accessibility and exact expiry checks
        run: npm run test:browser 2>&1 | tee research/harvest-d2a55add/browser.log
      - name: Record runner identity without changing source timestamps
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'workflow_run_id': os.environ['RUN_ID'], 'attempt': os.environ['RUN_ATTEMPT'],
                     'checkout_sha': os.environ['RUN_SHA'], 'run_url': os.environ['RUN_URL'],
                     'publishes_pages': False, 'snapshot': 'research/harvest-d2a55add/snapshot.json'}
          Path('research/harvest-d2a55add/run.json').write_text(json.dumps(receipt, indent=1) + '\n')
          PY
      - name: Commit only the dated research receipts to the fixed session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/harvest-d2a55add
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retain fresh coverage harvest from run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin arena/d2a55add-maltaproj4
          git push origin arena/d2a55add-maltaproj4
      - name: Retain candidate and audit artifacts even when a gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-harvest-d2a55add-${{ github.run_id }}
          path: |
            research/harvest-d2a55add
            runtime/latest.json
            runtime/independent-row-audit.md
            public/build-info.json
          retention-days: 14
