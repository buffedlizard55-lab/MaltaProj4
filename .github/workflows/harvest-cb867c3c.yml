name: Coverage harvest cb867c3c (non-publishing)

# Non-publishing official-source capture bound strictly to Arena branch
# arena/cb867c3c-maltaproj4 when commit message contains [capture] or via manual dispatch.
on:
  push:
    branches: [arena/cb867c3c-maltaproj4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coverage-harvest-cb867c3c
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/arena/cb867c3c-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official sources, quarantine, audit, and archive raw bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/harvest-cb867c3c
          python -m scripts.refresh --output runtime/latest.json
          python -m scripts.quarantine runtime/latest.json
          python verification-c6/audit_snapshot.py runtime/latest.json --output research/harvest-cb867c3c/row-audit.md
          python -m scripts.probe_cb867c3c --snapshot runtime/latest.json --output research/harvest-cb867c3c
      - name: Commit exact official-source evidence to fixed session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/harvest-cb867c3c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retain official-source harvest from run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin arena/cb867c3c-maltaproj4
          git push origin arena/cb867c3c-maltaproj4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-harvest-cb867c3c-${{ github.run_id }}
          path: research/harvest-cb867c3c
          retention-days: 7
