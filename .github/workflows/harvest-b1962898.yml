name: Capture b1962898 (non-publishing)

# Non-publishing official-source capture bound to arena/b1962898-maltaproj4.
# Runs on a real internet egress (this sandbox cannot reach Hotspawn, HLTV, the
# exchanges or the books), refreshes the board, audits every row against its own
# raw fields, reads each distinct external source URL and records the HTTP
# status, then commits the dated evidence back to the same branch. It never
# publishes to Pages and never edits data/latest.json: the board is installed and
# re-verified locally, then delivered through the normal merge.
on:
  push:
    branches: [arena/b1962898-maltaproj4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capture-b1962898
  cancel-in-progress: false
jobs:
  capture:
    # Only on this session's branch, and only for a deliberate capture commit (or
    # a manual dispatch), so ordinary documentation commits cost nothing.
    if: github.ref == 'refs/heads/arena/b1962898-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh every official source
        run: |
          mkdir -p runtime research/harvest-b1962898
          python -m scripts.refresh --output runtime/latest.json --previous data/latest.json
          cp runtime/latest.json research/harvest-b1962898/snapshot.json
      - name: Withhold rows the independent audit cannot reproduce
        run: python -m scripts.quarantine research/harvest-b1962898/snapshot.json
      - name: Independent row audit, with a live read of every external source link
        run: |
          python -m scripts.audit_b1962898 --snapshot research/harvest-b1962898/snapshot.json \
            --output research/harvest-b1962898 --check-links | tee research/harvest-b1962898/audit-run.log
      - name: Build and validate the captured board
        run: |
          python -m scripts.build --data research/harvest-b1962898/snapshot.json --out runtime/public
          python -m scripts.validate --data research/harvest-b1962898/snapshot.json --site runtime/public | tee research/harvest-b1962898/validate-run.log
      - name: Record how the capture compares with the committed board
        run: |
          python - <<'PY' | tee research/harvest-b1962898/COMPARISON.md
          import json
          from pathlib import Path
          new = json.loads(Path('research/harvest-b1962898/snapshot.json').read_text())
          old = json.loads(Path('data/latest.json').read_text())
          def open_ids(d):
              return {m['id'] for m in d['matches'] if m.get('state') == 'open'}
          new_open, old_open = open_ids(new), open_ids(old)
          added, removed = sorted(new_open - old_open), sorted(old_open - new_open)
          print('# Capture comparison\n')
          print('| Board | Snapshot | Rows | Open |')
          print('| --- | --- | --- | --- |')
          for label, doc in (('committed', old), ('this capture', new)):
              print('| %s | %s | %d | %d |' % (label, doc.get('fixtures_observed_at'), len(doc['matches']), len(open_ids(doc))))
          print('\n| Change | Fixture IDs |')
          print('| --- | --- |')
          print('| Newly open in this capture | %s |' % (', '.join(added) or 'none'))
          print('| No longer open | %s |' % (', '.join(removed) or 'none'))
          PY
      - name: Commit the dated evidence to this session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/harvest-b1962898
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture official-source board and independent audit (run ${GITHUB_RUN_ID}) [skip ci]"
          git pull --rebase origin arena/b1962898-maltaproj4
          git push origin arena/b1962898-maltaproj4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        if: always()
        with:
          name: capture-b1962898-${{ github.run_id }}
          path: |
            research/harvest-b1962898
            runtime
          retention-days: 7
