name: Fresh coverage harvest ce45f672 (non-publishing)

# A real refresh on a normal GitHub egress (the authoring sandbox reaches GitHub
# and package registries only), followed by quarantine, the independent evidence
# replay, the production build and its validator, the per-row coverage audit and
# the phone/browser gates. Only dated research receipts and the candidate
# snapshot are committed; this workflow never deploys Pages and never pushes a
# generated board to main. Publication stays with pages.yml after the integration
# PR merges.
on:
  push:
    branches: [arena/ce45f672-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-harvest-ce45f672
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/arena/ce45f672-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Refresh Hotspawn, Polymarket, HLTV, Pinnacle, books and Valve sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime research/harvest-ce45f672
          python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-ce45f672/refresh.log
          cp runtime/latest.json research/harvest-ce45f672/snapshot-raw.json
      - name: Quarantine any row the independent evidence replay cannot reproduce
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-ce45f672/quarantine.log
      - name: Independently audit every refreshed row
        run: |
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/independent-row-audit.md
          cp runtime/independent-row-audit.md research/harvest-ce45f672/independent-row-audit.md
      - name: Independent re-derivation of every open pick (session 0cc1138a verifier)
        run: |
          python research/session-0cc1138a/verify_0cc1138a.py --data runtime/latest.json \
            2>&1 | tee research/harvest-ce45f672/pick-rederivation.log
      - name: Keep the quarantined candidate snapshot beside its audit
        run: cp runtime/latest.json research/harvest-ce45f672/snapshot.json
      - name: Build and validate the fresh candidate exactly as publication does
        run: |
          python -m scripts.build --data runtime/latest.json 2>&1 | tee research/harvest-ce45f672/build.log
          python -m scripts.validate --data runtime/latest.json 2>&1 | tee research/harvest-ce45f672/validate.log
          python verification-c6/audit_snapshot.py public/data/latest.json --output research/harvest-ce45f672/published-row-audit.md
          python -m scripts.audit_f89bb1f8 --data public/data/latest.json 2>&1 | tee research/harvest-ce45f672/coverage-audit.log
      - name: Phone, desktop, accessibility and exact expiry checks
        run: npm run test:browser 2>&1 | tee research/harvest-ce45f672/browser.log
      - name: Record runner identity without changing source timestamps
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'workflow_run_id': os.environ['RUN_ID'], 'attempt': os.environ['RUN_ATTEMPT'],
                     'checkout_sha': os.environ['RUN_SHA'], 'run_url': os.environ['RUN_URL'],
                     'publishes_pages': False, 'snapshot': 'research/harvest-ce45f672/snapshot.json'}
          Path('research/harvest-ce45f672/run.json').write_text(json.dumps(receipt, indent=1) + '\n')
          PY
      - name: Commit only the dated research receipts to the fixed session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/harvest-ce45f672
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retain fresh coverage harvest from run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin arena/ce45f672-maltaproj4
          git push origin arena/ce45f672-maltaproj4
      - name: Retain candidate and audit artifacts even when a gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-harvest-ce45f672-${{ github.run_id }}
          path: |
            research/harvest-ce45f672
            runtime/latest.json
            runtime/independent-row-audit.md
            public/build-info.json
          retention-days: 14
