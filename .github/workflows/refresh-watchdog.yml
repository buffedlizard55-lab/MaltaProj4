name: CS2 refresh watchdog

# Keeps the published pick board inside its evidence window. GitHub delivered
# this repository's scheduled runs 3-5 hours late on 15 October 2026, then
# skipped the 23:17, 00:17 and 02:17 UTC slots, and on 16 October 2026 delivered
# none of the 05:17/06:17/07:17Z slots after the hourly cron landed, which left
# the live dashboard with a stale snapshot. This workflow does not replace the real refresh and
# never publishes: it reads the live build receipt plus the run history, and if
# the published snapshot is older than the allowed window it dispatches the
# existing, fully verified publication workflow (pages.yml) exactly once, with a
# cooldown and a daily budget so it cannot loop.

on:
  schedule:
    # Every 10 minutes: a cheap decision check, so a missed or delayed refresh is
    # noticed within ten minutes of becoming overdue rather than at the next cron
    # slot. Delivery, not frequency, is the binding constraint on this
    # repository: the hourly pages.yml cron produced three runs in total and none
    # at all for the 05:17/06:17/07:17Z slots on 16 October 2026, and this
    # workflow itself had zero runs in the five hours after it reached main. Ten
    # minutes multiplies the number of chances for one tick to land; the script's
    # own cooldown (45 min) and daily budget (10 dispatches) stop it looping, and
    # the freshness gate in pages.yml stops a dispatched run from rebuilding
    # anything that is already published.
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cs2-refresh-watchdog
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Measure published freshness and dispatch once if overdue
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh_watchdog
      - name: Unit tests for the decision rules
        run: python -m unittest tests.test_refresh_watchdog -v
