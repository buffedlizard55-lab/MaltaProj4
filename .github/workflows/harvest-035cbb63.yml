name: Research harvest 035cbb63 (non-publishing)

# Why this exists: the authoring sandbox reaches GitHub and package registries
# only (re-verified 2026-10-17), so the real, unmodified refresh plus the live
# evidence probe run here on a runner with normal outbound access and their raw
# responses are committed for line-by-line re-checking. This workflow never
# publishes to Pages and never deploys; publication stays with pages.yml on
# main. Every command's real exit status is preserved because `continue-on-error`
# would otherwise hide a failure.
#
# The probe is scripts/probe_621776e4.py, reused unmodified with --output
# pointed at this session's directory. It is invoked, not edited, so no other
# session's file scope is touched.

on:
  push:
    branches: [arena/035cbb63-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-035cbb63-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/harvest-035cbb63/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-035cbb63/logs/refresh.txt
      - name: Live-evidence probe (Polymarket, Pinnacle, HLTV, esportsbooks)
        continue-on-error: true
        run: python -m scripts.probe_621776e4 --snapshot runtime/latest.json --output research/harvest-035cbb63 2>&1 | tee research/harvest-035cbb63/logs/probe.txt
      - name: Hotspawn inventory-completeness audit (is the scoped query complete?)
        continue-on-error: true
        run: python -m scripts.inventory_035cbb63 --output research/inventory-035cbb63 --snapshot runtime/latest.json 2>&1 | tee research/harvest-035cbb63/logs/inventory-audit.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md 2>&1 | tee research/harvest-035cbb63/logs/row-audit.txt
      - name: Copy the refreshed snapshot and audit for review
        run: |
          cp runtime/latest.json research/harvest-035cbb63/snapshot.json
          if [ -s runtime/row-audit.md ]; then cp runtime/row-audit.md research/harvest-035cbb63/row-audit.md; fi
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-035cbb63
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest 035cbb63 from run ${GITHUB_RUN_ID} (no publication) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-035cbb63-${{ github.run_id }}
          path: |
            research/harvest-035cbb63
            runtime/latest.json
            runtime/row-audit.md
          retention-days: 7
