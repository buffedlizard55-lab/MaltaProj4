name: Research harvest 85c33bf9 (non-publishing)

# Why this exists: the authoring sandbox reaches GitHub and package registries
# only, so the real, unmodified production refresh plus the live evidence
# probes run here on a runner with normal outbound access and their raw
# responses are committed for line-by-line re-checking. This workflow never
# publishes to Pages and never deploys; publication stays with pages.yml on
# main. Every command's real exit status is preserved in the tee'd logs;
# `continue-on-error` is used only where a source outage must not hide the
# other sources' captures (the outage itself is recorded in the logs).
#
# Reused unmodified, invoked with --output pointed at this session's
# directories: scripts/refresh.py, scripts/quarantine.py,
# verification-c6/audit_snapshot.py, scripts/harvest.py,
# scripts/probe_621776e4.py and scripts/egw_probe.py. No other session's file
# is edited.

on:
  push:
    branches: [arena/85c33bf9-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-85c33bf9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/harvest-85c33bf9/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-85c33bf9/logs/refresh.txt
      - name: Withhold any row the independent audit cannot reproduce
        continue-on-error: true
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-85c33bf9/logs/quarantine.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md 2>&1 | tee research/harvest-85c33bf9/logs/row-audit.txt
      - name: Assemble the research harvest summary
        continue-on-error: true
        run: python -m scripts.harvest --runtime runtime/latest.json --output research/harvest-85c33bf9 2>&1 | tee research/harvest-85c33bf9/logs/harvest.txt
      - name: Live-evidence probe (Polymarket, Pinnacle, HLTV, esportsbooks)
        continue-on-error: true
        run: python -m scripts.probe_621776e4 --snapshot runtime/latest.json --output research/harvest-85c33bf9/probe 2>&1 | tee research/harvest-85c33bf9/logs/probe.txt
      - name: EGamersWorld book-listing capture (receipt re-collection evidence)
        continue-on-error: true
        run: python -m scripts.egw_probe --output research/harvest-85c33bf9/egw 2>&1 | tee research/harvest-85c33bf9/logs/egw.txt
      - name: Copy the refreshed snapshot and audit for review
        run: |
          if [ -s runtime/latest.json ]; then cp runtime/latest.json research/harvest-85c33bf9/snapshot.json; fi
          if [ -s runtime/row-audit.md ]; then cp runtime/row-audit.md research/harvest-85c33bf9/row-audit.md; fi
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-85c33bf9
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest 85c33bf9 from run ${GITHUB_RUN_ID} (no publication) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-85c33bf9-${{ github.run_id }}
          path: |
            research/harvest-85c33bf9
            runtime/latest.json
            runtime/row-audit.md
          retention-days: 7
