name: Research harvest 1abe803f (non-publishing)

# Why this exists: the authoring sandbox reaches GitHub and package registries
# only, so the real, unmodified refresh plus its independent audits run here and
# the raw results are committed to this session's own directory for line-by-line
# re-checking. This workflow never publishes to Pages and never deploys;
# publication stays with pages.yml on main. Every command's real exit status is
# written to a file because `continue-on-error` would otherwise hide a failure.
#
# Re-used unchanged by session 1abe803f (same tested scripts, new output directory)
# Added by session dedd2e34: an HLTV-versus-board coverage gap check and a
# read-only esportsbook accessibility probe, both research-only.

on:
  push:
    branches: [arena/1abe803f-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-1abe803f-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directory
        run: mkdir -p research/harvest-1abe803f/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        run: |
          set +e
          python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-1abe803f/logs/refresh.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/refresh.exit
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: |
          set +e
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md 2>&1 | tee research/harvest-1abe803f/logs/row-audit.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/row-audit.exit
      - name: Build and validate exactly as publication does
        continue-on-error: true
        run: |
          set +e
          python -m scripts.build --data runtime/latest.json 2>&1 | tee research/harvest-1abe803f/logs/build.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/build.exit
          python -m scripts.validate --data runtime/latest.json 2>&1 | tee research/harvest-1abe803f/logs/validate.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/validate.exit
      - name: Independent row audit of the built artifact
        continue-on-error: true
        run: |
          set +e
          python verification-c6/audit_snapshot.py public/data/latest.json --output runtime/published-row-audit.md 2>&1 | tee research/harvest-1abe803f/logs/published-row-audit.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/published-row-audit.exit
      - name: Hotspawn board versus HLTV schedule coverage gap
        continue-on-error: true
        run: |
          set +e
          python -m scripts.coverage_gap_dedd2e34 --output runtime/coverage-gap.json --markdown runtime/coverage-gap.md 2>&1 | tee research/harvest-1abe803f/logs/coverage-gap.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/coverage-gap.exit
      - name: Read-only esportsbook accessibility probe
        continue-on-error: true
        run: |
          set +e
          python -m scripts.book_probe_dedd2e34 --output runtime/book-probe.json 2>&1 | tee research/harvest-1abe803f/logs/book-probe.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/book-probe.exit
      - name: Summarise the harvest without editing any value
        continue-on-error: true
        run: |
          set +e
          python -m scripts.harvest_dedd2e34 --runtime runtime/latest.json \
            --output research/harvest-1abe803f \
            --run-id "${GITHUB_RUN_ID}" --branch "${GITHUB_REF_NAME}" 2>&1 | tee research/harvest-1abe803f/logs/summary.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-1abe803f/logs/summary.exit
      - name: Commit harvest (no publication)
        if: always()
        run: |
          git config user.name "harvest-runner-1abe803f"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-1abe803f
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest 1abe803f snapshot from run ${GITHUB_RUN_ID} (no publication) [harvest-skip]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
