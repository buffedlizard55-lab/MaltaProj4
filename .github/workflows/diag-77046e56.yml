name: Hotspawn inventory probe 77046e56 (read-only)

# Session 77046e56 (Arena-fixed branch arena/77046e56-maltaproj4).
#
# The authoring sandbox cannot reach Hotspawn, so this probe runs on a normal
# GitHub egress and commits its dated receipts back to this session's branch.
# It never mutates data/, never publishes Pages and never pushes to main.
on:
  push:
    branches: [arena/77046e56-maltaproj4]
    paths:
      - scripts/diag_77046e56.py
      - .github/workflows/diag-77046e56.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag-77046e56
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/arena/77046e56-maltaproj4'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe every documented request, retain receipts
        run: |
          set -o pipefail
          mkdir -p research/session-77046e56/diag
          python -m scripts.diag_77046e56 2>&1 | tee research/session-77046e56/diag/probe.log
      - name: Commit receipts to the session branch
        if: always()
        run: |
          git config user.name "cs2-inventory-probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/session-77046e56/diag
          if git diff --cached --quiet; then
            echo "No probe receipt to commit."
            exit 0
          fi
          git commit -m "Retain dated Hotspawn inventory probe ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin arena/77046e56-maltaproj4
          git push origin arena/77046e56-maltaproj4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inventory-probe-77046e56-${{ github.run_id }}
          path: research/session-77046e56/diag
          retention-days: 14
