name: Coverage harvest 071642e7 (non-publishing)

on:
  push:
    branches: [arena/071642e7-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-harvest-071642e7
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/arena/071642e7-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official sources and capture primary evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/session-071642e7/logs runtime
          python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/session-071642e7/logs/refresh.txt
          python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/session-071642e7/logs/quarantine.txt
          python -m scripts.probe_071642e7 --snapshot runtime/latest.json --output research/session-071642e7 2>&1 | tee research/session-071642e7/logs/probe.txt
          python verification-c6/audit_snapshot.py runtime/latest.json --output research/session-071642e7/row-audit.md 2>&1 | tee research/session-071642e7/logs/row-audit.txt
          cp runtime/latest.json research/session-071642e7/refresh-snapshot.json
          find research/session-071642e7 -name '*.gz' -size +2M -delete || true
          du -sh research/session-071642e7 || true
      - name: Commit dated harvest back to session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/session-071642e7
          if git diff --cached --quiet; then echo "No capture changes to commit."; exit 0; fi
          git commit -m "Retain official-source harvest from run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin arena/071642e7-maltaproj4
          git push origin arena/071642e7-maltaproj4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-harvest-071642e7-${{ github.run_id }}
          path: research/session-071642e7
          retention-days: 7
