name: Verify, refresh and publish CS2 Scout
on:
  push:
    branches: [main, arena/e9be3e6b-maltaproj4, arena/cecfe864-maltaproj4, arena/dddcb90d-maltaproj4, arena/071642e7-maltaproj4, arena/4fd13975-maltaproj4, arena/8fdf1f99-maltaproj4, arena/cf12d97f-maltaproj4, arena/035cbb63-maltaproj4, arena/1395f539-maltaproj4, arena/29549098-maltaproj4, arena/40c14278-maltaproj4, arena/50f79045-maltaproj4, arena/7ec4608a-maltaproj4, arena/84295759-maltaproj4, arena/8c8e3c5f-maltaproj4, arena/96ea1af8-maltaproj4, arena/9787ce4b-maltaproj4, arena/9a81b26f-maltaproj4, arena/a56d155f-maltaproj4, arena/ab18fe2a-maltaproj4, arena/afce4281-maltaproj4, arena/bf09aa40-maltaproj4, arena/c4d25599-maltaproj4, arena/ce21a932-maltaproj4, arena/db1f35c5-maltaproj4, arena/e54807b3-maltaproj4, arena/ef0969b9-maltaproj4, arena/174afa4f-maltaproj4, arena/4ed657ce-maltaproj4, arena/233b8a0e-maltaproj4]
  pull_request:
    branches: [main]
  schedule:
    # Dense, because a sparse cron does not survive this repository's measured
    # delivery record: GitHub ran the six-hour cron 3h05m and 4h42m late on
    # 2026-10-15, then delivered only THREE scheduled runs in total (16:59:51Z
    # success, 21:22:25Z failure, 04:33:39Z failure) and none at all for the
    # 05:17/06:17/07:17Z slots after the then-hourly cron landed, while every open
    # pick on the live site expired. The current schedule uses four slots an hour, offset off the :00
    # stampede, is what turns "delivered late" into "delivered inside the 4-8 h
    # promise"; the freshness gate below is what keeps the extra slots cheap.
    # See research/ef0969b9/ and research/refresh-ab18fe2a/DIAGNOSIS.md.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs2-scout-${{ github.ref }}
  # Normal refreshes retain cancel-in-progress: false. Only a deliberately
  # labelled trusted main release can drain a demonstrably obsolete queued run;
  # ordinary commits, PRs and cron cannot starve a healthy source refresh.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release-queue-reset]') }}
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Writing back the verified build keeps the committed legacy main:/ root
    # fallback from freezing at an old snapshot (see the staging step below).
    permissions:
      contents: write
    outputs:
      manifest_sha: ${{ steps.receipt.outputs.manifest_sha }}
      built_at: ${{ steps.receipt.outputs.built_at }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Freshness gate (scheduled slots only; fails open)
        id: gate
        run: |
          python3 -m scripts.publish_gate
          {
            echo "### Freshness gate"
            echo '```json'
            GITHUB_OUTPUT= python3 -m scripts.publish_gate --event schedule --sha "$GITHUB_SHA" --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.publish == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.publish == 'true'
      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.publish == 'true'
      - name: Unit and independent failure-mode tests
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s audits -p 'test_*.py' -v
          python verification-95b588c2/test_integrity.py
          python -m unittest discover -s verification-c6 -p 'test_*.py' -v
          python -m scripts.validate --data data/latest.json --site .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        with:
          path: runtime/latest.json
          key: cs2-snapshot-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cs2-snapshot-v2-
      - name: Restore committed baseline if no recent snapshot exists
        if: steps.gate.outputs.publish == 'true'
        run: |
          mkdir -p runtime
          if ! test -s runtime/latest.json; then cp data/latest.json runtime/latest.json; fi
      - name: Refresh official sources (trusted branches only)
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        env:
          # Read-only token, sent only to api.github.com for Valve's public standings index.
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh --output runtime/latest.json
      - name: Withhold any row the independent audit cannot reproduce
        if: steps.gate.outputs.publish == 'true'
        run: python -m scripts.quarantine runtime/latest.json
      - name: Build and independently verify every row, calculation and internal link
        if: steps.gate.outputs.publish == 'true'
        run: |
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/independent-row-audit.md
          python -m scripts.build --data runtime/latest.json
          python -m scripts.validate --data runtime/latest.json
          python verification-c6/audit_snapshot.py public/data/latest.json --output runtime/published-row-audit.md
      - name: Phone, tablet, desktop, accessibility and exact-boundary expiry checks
        if: steps.gate.outputs.publish == 'true'
        run: npm run test:browser
      - name: Keep the legacy main:/ root fallback on the verified build
        # Pages is configured as build_type: legacy with source main:/ (the PUT
        # that would switch it to GitHub Actions answers 403 for this token), so
        # every push republishes the committed root pages over the artifact this
        # job just deployed. On 2026-10-21 that left the public board serving the
        # frozen 18 Oct snapshot three hours after a green deploy. Committing the
        # verified build here makes both paths serve the same bytes. The guard
        # refuses to go backwards, refuses an expired build, and holds a 4-hour
        # cooldown so the root is never more than one refresh slot behind.
        # Each retry drops a broken rebase and replays the verified build on top
        # of the current origin/main, re-running its own build and validators.
        id: rootfallback
        # Session 572c65b7 (2026-10-24): this step is the *mitigation*, not the
        # product. Between 09:03Z and 16:07Z it failed four times in a row
        # (40080448344, 40082763751, 40084520702, 40097410704) and, because a
        # failed step fails the job, it also skipped upload-pages-artifact and
        # the deploy -- so a verified, freshly refreshed board was withheld from
        # visitors by a legacy-root problem while the public site served the
        # 08:06Z snapshot until its eight-hour window closed and every pick was
        # withheld. continue-on-error keeps that from happening again: the root
        # is still only committed when its own gates pass (rc 3 still refuses to
        # commit), but the verified artifact now deploys and the failure is
        # published as an error annotation plus runtime/root-fallback.json by the
        # next step instead of freezing the board.
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: |
          STAGED_PATHS="404.html analysis.html assets build-info.json data/latest.json data/matches.csv evidence.html index.html matches.html methodology.html picks.html review.html site sources.html unresolved.html .nojekyll"
          mkdir -p runtime
          report() {
            python - "$1" "$2" "$3" <<'PY'
          import json, pathlib, sys
          rc, gate, reason = sys.argv[1], sys.argv[2], sys.argv[3]
          pathlib.Path('runtime/root-fallback.json').write_text(json.dumps({
              'rc': rc, 'gate': gate, 'reason': reason,
              'committed': rc == '0',
              'artifact_still_deploys': rc != '0',
          }, indent=1))
          print('root-fallback report: rc=%s gate=%s' % (rc, gate))
          PY
          }
          publish() {
            # The snapshot the root carried before this run stages the fresh one.
            # scripts.staged_gate uses it as the control that tells a genuine unit
            # failure apart from tests that are merely written against the live
            # board (session 572c65b7: two pinned fixture ids aged off the board on
            # 2026-10-24 and refused every publication for seven hours).
            test -s data/latest.json && cp data/latest.json runtime/pre-staging-latest.json
            python -m scripts.publish_root_fallback --public public --root . --cooldown-hours 0.2 || return 1
            if [ -z "$(git status --porcelain -- $STAGED_PATHS)" ]; then
              echo "Root fallback already carries this snapshot; nothing to commit."; return 2
            fi
            python -m scripts.staged_gate --check data --previous runtime/pre-staging-latest.json || return 3
            python -m scripts.staged_gate --check units --previous runtime/pre-staging-latest.json || return 3
            git config user.name "cs2-scout-publisher"
            git config user.email "cs2-scout-publisher@users.noreply.github.com"
            git add -- $STAGED_PATHS data/book-receipts.json
            if git diff --cached --quiet; then
              echo "Root fallback already carries this snapshot; nothing staged to commit."; return 2
            fi
            git status --short
            git commit -m "Publish the verified build to the legacy main:/ root fallback"
          }
          # publish(): 0 = committed, 2 = already current or refused, 3 = the staged
          # root failed its own gate, 1 = failure. Session a30d31a0 (2026-10-24):
          # `dce494b` was committed by this step with 8 unit failures and a root
          # stylesheet rolled back past PR #245. set +e is active around publish(),
          # so its validate/unit lines never stopped the commit; they now return 3
          # and fail the step before anything is pushed, keeping main green.
          # scripts.publish_root_fallback refuses a build made from older source
          # than the checkout (the replay path), and this pre-push hook re-checks at
          # the moment of every push against the exact commit the push would
          # fast-forward, so the rebase path cannot roll newer source back either.
          printf '#!/bin/sh\nwhile read lref lsha rref rsha; do python -m scripts.publish_root_fallback --check-drift --revision %s --against "$rsha" || exit 1; done\n' "$GITHUB_SHA" > .git/hooks/pre-push
          chmod +x .git/hooks/pre-push
          set +e; publish; rc=$?; set -e
          [ "$rc" = "2" ] && { report 2 none "the committed root already carries this snapshot"; exit 0; }
          [ "$rc" = "3" ] && { report 3 pinned-gate "the staged root failed its own validator or unit gate, so it was not committed"; echo "::error::The staged root failed its own validator or unit gate, so it was not committed and main stays green."; exit 1; }
          [ "$rc" = "0" ] || { report 1 stage "the verified build could not be staged at the root"; echo "::error::The verified build could not be staged at the root."; exit 1; }
          report 0 none "the verified build was committed to the legacy root fallback"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            # A conflicting rebase used to wedge every later attempt, so a green
            # build never reached the root. Drop it and replay the verified build
            # on top of the current origin/main, validators included.
            git rebase --abort >/dev/null 2>&1 || true
            git merge --abort >/dev/null 2>&1 || true
            echo "::warning::main moved during publication (attempt $attempt); replaying the verified build on origin/main."
            git fetch origin main
            git checkout -B publish-root-fallback origin/main
            set +e; publish; rc=$?; set -e
            [ "$rc" = "2" ] && { report 2 none "the replayed root already carried this snapshot"; exit 0; }
            [ "$rc" = "3" ] && { report 3 pinned-gate "the re-staged root failed its own validator or unit gate, so it was not committed"; echo "::error::The re-staged root failed its own validator or unit gate, so it was not committed and main stays green."; exit 1; }
            [ "$rc" = "0" ] || { report 1 stage "the verified build could not be re-staged on origin/main"; echo "::error::The verified build could not be re-staged on origin/main."; exit 1; }
            sleep $((attempt * 10))
          done
          # Only the root-push race is non-blocking. Every refresh, build,
          # validation, unit and browser gate above must already have passed.
          # A newer main root must not strand this verified Actions artifact.
          git rebase --abort >/dev/null 2>&1 || true
          echo "::warning::Could not push the staged root fallback after three attempts; deploying the verified Actions artifact while the newest main:/ root publishes independently."
          exit 0
      - name: Explain a legacy-root failure without withholding the verified board
        # Runs only when the step above broke. The artifact still deploys: this
        # step publishes exactly why the committed root was left alone, and names
        # the failing test or validator line, so the next session does not have to
        # guess (measured: four runs lost to an unread annotation on 2026-10-24).
        if: always() && steps.rootfallback.outcome == 'failure'
        run: |
          {
            echo "### Legacy root fallback not updated"
            echo ""
            echo "The verified Actions artifact still deploys. Only the committed"
            echo "main:/ fallback was left alone."
            echo '```json'
            cat runtime/root-fallback.json 2>/dev/null || echo '{"rc":"unknown","reason":"no report written"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The checkout still carries the staged root, so the two gates can be
          # re-run here for their exact output. This costs nothing on a healthy
          # run (the step only runs when the staging step broke) and it is the
          # only way to name the failing test without changing the pinned
          # `|| return 3` lines inside publish().
          if ! python -m scripts.validate --data data/latest.json --site . > runtime/root-gate-validate.log 2>&1; then
            echo "::error::[staged root] scripts.validate --site . FAILED"
            tail -25 runtime/root-gate-validate.log | sed "s|^|::error::[validate] |" || true
          elif ! python -m unittest discover -s tests > runtime/root-gate-unit.log 2>&1; then
            grep -E '^(FAIL|ERROR):' runtime/root-gate-unit.log | head -25 | sed "s|^|::error::[unit] |" || true
            tail -12 runtime/root-gate-unit.log | sed "s|^|::warning::[unit] |" || true
            echo "A rotation-coupled failure cannot reach this step any more: scripts.staged_gate" \
                 "re-runs each failing test against the pre-staging snapshot and publishes with a" \
                 "warning when that is the only cause. Reaching this branch means a module failed on" \
                 "both boards, which is a real defect."
          else
            echo "::warning::Both staged-root gates pass now; the earlier failure was transient (source drift or a concurrent push)."
          fi
          { echo ""; echo "#### Staged gate report"; echo '```json'; \
            cat runtime/staged-gate.json 2>/dev/null || echo '{"checks":[]}'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the exact artifact expected at the public site
        id: receipt
        if: steps.gate.outputs.publish == 'true'
        run: |
          echo "manifest_sha=$(sha256sum public/build-info.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(python -c 'import json;print(json.load(open("public/build-info.json"))["built_at"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        with:
          path: runtime/latest.json
          key: cs2-snapshot-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain source evidence and verification reports
        if: always() && steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ github.run_id }}
          path: |
            runtime/
            public/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        with:
          path: public
      - name: Explain a skipped slot
        if: steps.gate.outputs.publish != 'true'
        run: |
          echo "### Scheduled slot skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The published site already carries this revision inside the freshness budget, so nothing was built and nothing was deployed. See research/ef0969b9/ for the cadence measurements behind this gate." >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify-build.outputs.publish == 'true'
    needs: verify-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy verified static dashboard
        id: deployment
        # Attempt one. A second attempt follows if this fails, and the live-byte
        # verification below is what decides the run: on 2026-10-16T04:33:39Z the
        # scheduled run's deployment (7110990374) failed while an overlapping
        # push-triggered deployment to the same github-pages environment
        # (7110983154) was in progress, so a red deploy step does not by itself
        # prove the dashboard is stale.
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Retry the deployment once when the first attempt failed
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The verification script lives in this repository and this job never checked the
        # repository out, so `python3 scripts/verify_live.py` exited 2 ("can't open file")
        # on every run that published -- while the site itself deployed correctly, because
        # deploy-pages ships the artifact that verify-build uploaded. Observed on the runs
        # for 40b13d3, 5053853, ca973c6 and 86321a8 on 2026-10-16: red deploy job, live
        # site serving that exact revision, and no live-verification receipt uploaded.
        with:
          persist-credentials: false

      - name: Verify live Pages bytes match this exact build
        env:
          SITE: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || 'https://buffedlizard55-lab.github.io/MaltaProj4/' }}
          MANIFEST_SHA: ${{ needs.verify-build.outputs.manifest_sha }}
          BUILT_AT: ${{ needs.verify-build.outputs.built_at }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          RETRY_OUTCOME: ${{ steps.deployment_retry.outcome }}
        # Polls for propagation (scripts/verify_live.py): on 2026-10-16 the
        # previous one-shot check read the outgoing deployment's bytes in the
        # same second the deploy ended and failed runs whose publication had
        # actually succeeded (38902730567, 38936303441, PR #41 push run).
        # The standard of proof is unchanged -- exact manifest bytes, or a
        # provably newer byte-consistent build -- only the patience changed.
        run: python3 scripts/verify_live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-verification-${{ github.run_id }}
          path: runtime/live-verification.json
          retention-days: 30
