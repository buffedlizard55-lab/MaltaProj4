name: Verify, refresh and publish CS2 Scout
on:
  push:
    branches: [main, arena/dddcb90d-maltaproj4, arena/071642e7-maltaproj4, arena/4fd13975-maltaproj4, arena/8fdf1f99-maltaproj4, arena/cf12d97f-maltaproj4, arena/035cbb63-maltaproj4, arena/1395f539-maltaproj4, arena/29549098-maltaproj4, arena/40c14278-maltaproj4, arena/50f79045-maltaproj4, arena/7ec4608a-maltaproj4, arena/84295759-maltaproj4, arena/8c8e3c5f-maltaproj4, arena/96ea1af8-maltaproj4, arena/9787ce4b-maltaproj4, arena/9a81b26f-maltaproj4, arena/a56d155f-maltaproj4, arena/ab18fe2a-maltaproj4, arena/afce4281-maltaproj4, arena/bf09aa40-maltaproj4, arena/c4d25599-maltaproj4, arena/ce21a932-maltaproj4, arena/db1f35c5-maltaproj4, arena/e54807b3-maltaproj4, arena/ef0969b9-maltaproj4, arena/174afa4f-maltaproj4]
  pull_request:
    branches: [main]
  schedule:
    # Dense, because a sparse cron does not survive this repository's measured
    # delivery record: GitHub ran the six-hour cron 3h05m and 4h42m late on
    # 2026-10-15, then delivered only THREE scheduled runs in total (16:59:51Z
    # success, 21:22:25Z failure, 04:33:39Z failure) and none at all for the
    # 05:17/06:17/07:17Z slots after the then-hourly cron landed, while every open
    # pick on the live site expired. The current schedule uses four slots an hour, offset off the :00
    # stampede, is what turns "delivered late" into "delivered inside the 4-8 h
    # promise"; the freshness gate below is what keeps the extra slots cheap.
    # See research/ef0969b9/ and research/refresh-ab18fe2a/DIAGNOSIS.md.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs2-scout-${{ github.ref }}
  # Normal refreshes retain cancel-in-progress: false. Only a deliberately
  # labelled trusted main release can drain a demonstrably obsolete queued run;
  # ordinary commits, PRs and cron cannot starve a healthy source refresh.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release-queue-reset]') }}
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Writing back the verified build keeps the committed legacy main:/ root
    # fallback from freezing at an old snapshot (see the staging step below).
    permissions:
      contents: write
    outputs:
      manifest_sha: ${{ steps.receipt.outputs.manifest_sha }}
      built_at: ${{ steps.receipt.outputs.built_at }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Freshness gate (scheduled slots only; fails open)
        id: gate
        run: |
          python3 -m scripts.publish_gate
          {
            echo "### Freshness gate"
            echo '```json'
            GITHUB_OUTPUT= python3 -m scripts.publish_gate --event schedule --sha "$GITHUB_SHA" --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.publish == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.publish == 'true'
      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.publish == 'true'
      - name: Unit and independent failure-mode tests
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s audits -p 'test_*.py' -v
          python verification-95b588c2/test_integrity.py
          python -m unittest discover -s verification-c6 -p 'test_*.py' -v
          python -m scripts.validate --data data/latest.json --site .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        with:
          path: runtime/latest.json
          key: cs2-snapshot-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cs2-snapshot-v2-
      - name: Restore committed baseline if no recent snapshot exists
        if: steps.gate.outputs.publish == 'true'
        run: |
          mkdir -p runtime
          if ! test -s runtime/latest.json; then cp data/latest.json runtime/latest.json; fi
      - name: Refresh official sources (trusted branches only)
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        env:
          # Read-only token, sent only to api.github.com for Valve's public standings index.
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh --output runtime/latest.json
      - name: Withhold any row the independent audit cannot reproduce
        if: steps.gate.outputs.publish == 'true'
        run: python -m scripts.quarantine runtime/latest.json
      - name: Build and independently verify every row, calculation and internal link
        if: steps.gate.outputs.publish == 'true'
        run: |
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/independent-row-audit.md
          python -m scripts.build --data runtime/latest.json
          python -m scripts.validate --data runtime/latest.json
          python verification-c6/audit_snapshot.py public/data/latest.json --output runtime/published-row-audit.md
      - name: Phone, tablet, desktop, accessibility and exact-boundary expiry checks
        if: steps.gate.outputs.publish == 'true'
        run: npm run test:browser
      - name: Keep the legacy main:/ root fallback on the verified build
        # Pages is still configured as build_type: legacy with source main:/ (the
        # PUT that would switch it to GitHub Actions answers 403 for this
        # integration), so every push republishes the committed root pages over
        # the artifact this job just deployed. On 2026-10-21 that left the public
        # board serving the frozen 18 Oct snapshot - "Current picks are withheld"
        # - three hours after a green deploy. Committing the verified build here
        # makes both publication paths serve the same bytes. The guard refuses
        # to go backwards, refuses an expired build, and holds a 4-hour cooldown
        # so the root is never more than one refresh slot behind.
        #
        # This push races other sessions and the watchdog. A single conflicting
        # rebase used to wedge every retry, so a green build never reached the
        # root; each retry now drops the broken rebase and replays the verified
        # build on top of the current origin/main, re-running its own validators.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: |
          STAGED_PATHS="404.html analysis.html assets build-info.json data/latest.json data/matches.csv evidence.html index.html matches.html methodology.html picks.html review.html site sources.html unresolved.html .nojekyll"
          publish() {
            python -m scripts.publish_root_fallback --public public --root . --cooldown-hours 0.2 || return 1
            if [ -z "$(git status --porcelain -- $STAGED_PATHS)" ]; then
              echo "Root fallback already carries this snapshot; nothing to commit."; return 2
            fi
            python -m scripts.validate --data data/latest.json --site . || return 3
            python -m unittest discover -s tests || return 3
            git config user.name "cs2-scout-publisher"
            git config user.email "cs2-scout-publisher@users.noreply.github.com"
            git add -- $STAGED_PATHS data/book-receipts.json
            if git diff --cached --quiet; then
              echo "Root fallback already carries this snapshot; nothing staged to commit."; return 2
            fi
            git status --short
            git commit -m "Publish the verified build to the legacy main:/ root fallback"
          }
          # publish(): 0 = committed, 2 = already current or refused, 3 = the staged
          # root failed its own gate, 1 = failure. Session a30d31a0 (2026-10-24):
          # `dce494b` was committed by this step with 8 unit failures and a root
          # stylesheet rolled back past PR #245. set +e is active around publish(),
          # so its validate/unit lines never stopped the commit; they now return 3
          # and fail the step before anything is pushed, keeping main green.
          # scripts.publish_root_fallback refuses a build made from older source
          # than the checkout (the replay path), and this pre-push hook re-checks at
          # the moment of every push against the exact commit the push would
          # fast-forward, so the rebase path cannot roll newer source back either.
          printf '#!/bin/sh\nwhile read lref lsha rref rsha; do python -m scripts.publish_root_fallback --check-drift --revision %s --against "$rsha" || exit 1; done\n' "$GITHUB_SHA" > .git/hooks/pre-push
          chmod +x .git/hooks/pre-push
          set +e; publish; rc=$?; set -e
          [ "$rc" = "2" ] && exit 0
          [ "$rc" = "3" ] && { echo "::error::The staged root failed its own validator or unit gate, so it was not committed and main stays green."; exit 1; }
          [ "$rc" = "0" ] || { echo "::error::The verified build could not be staged at the root."; exit 1; }
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            # A conflicting rebase used to wedge every later attempt, so a green
            # build never reached the root. Drop it and replay the verified build
            # on top of the current origin/main, validators included.
            git rebase --abort >/dev/null 2>&1 || true
            git merge --abort >/dev/null 2>&1 || true
            echo "::warning::main moved during publication (attempt $attempt); replaying the verified build on origin/main."
            git fetch origin main
            git checkout -B publish-root-fallback origin/main
            set +e; publish; rc=$?; set -e
            [ "$rc" = "2" ] && exit 0
            [ "$rc" = "3" ] && { echo "::error::The re-staged root failed its own validator or unit gate, so it was not committed and main stays green."; exit 1; }
            [ "$rc" = "0" ] || { echo "::error::The verified build could not be re-staged on origin/main."; exit 1; }
            sleep $((attempt * 10))
          done
          # Only the root-push race is non-blocking. Every refresh, build,
          # validation, unit and browser gate above must already have passed.
          # A newer main root must not strand this verified Actions artifact.
          git rebase --abort >/dev/null 2>&1 || true
          echo "::warning::Could not push the staged root fallback after three attempts; deploying the verified Actions artifact while the newest main:/ root publishes independently."
          exit 0
      - name: Record the exact artifact expected at the public site
        id: receipt
        if: steps.gate.outputs.publish == 'true'
        run: |
          echo "manifest_sha=$(sha256sum public/build-info.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(python -c 'import json;print(json.load(open("public/build-info.json"))["built_at"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        with:
          path: runtime/latest.json
          key: cs2-snapshot-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain source evidence and verification reports
        if: always() && steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ github.run_id }}
          path: |
            runtime/
            public/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        with:
          path: public
      - name: Explain a skipped slot
        if: steps.gate.outputs.publish != 'true'
        run: |
          echo "### Scheduled slot skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The published site already carries this revision inside the freshness budget, so nothing was built and nothing was deployed. See research/ef0969b9/ for the cadence measurements behind this gate." >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify-build.outputs.publish == 'true'
    needs: verify-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy verified static dashboard
        id: deployment
        # Attempt one. A second attempt follows if this fails, and the live-byte
        # verification below is what decides the run: on 2026-10-16T04:33:39Z the
        # scheduled run's deployment (7110990374) failed while an overlapping
        # push-triggered deployment to the same github-pages environment
        # (7110983154) was in progress, so a red deploy step does not by itself
        # prove the dashboard is stale.
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Retry the deployment once when the first attempt failed
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The verification script lives in this repository and this job never checked the
        # repository out, so `python3 scripts/verify_live.py` exited 2 ("can't open file")
        # on every run that published -- while the site itself deployed correctly, because
        # deploy-pages ships the artifact that verify-build uploaded. Observed on the runs
        # for 40b13d3, 5053853, ca973c6 and 86321a8 on 2026-10-16: red deploy job, live
        # site serving that exact revision, and no live-verification receipt uploaded.
        with:
          persist-credentials: false

      - name: Verify live Pages bytes match this exact build
        env:
          SITE: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || 'https://buffedlizard55-lab.github.io/MaltaProj4/' }}
          MANIFEST_SHA: ${{ needs.verify-build.outputs.manifest_sha }}
          BUILT_AT: ${{ needs.verify-build.outputs.built_at }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          RETRY_OUTCOME: ${{ steps.deployment_retry.outcome }}
        # Polls for propagation (scripts/verify_live.py): on 2026-10-16 the
        # previous one-shot check read the outgoing deployment's bytes in the
        # same second the deploy ended and failed runs whose publication had
        # actually succeeded (38902730567, 38936303441, PR #41 push run).
        # The standard of proof is unchanged -- exact manifest bytes, or a
        # provably newer byte-consistent build -- only the patience changed.
        run: python3 scripts/verify_live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-verification-${{ github.run_id }}
          path: runtime/live-verification.json
          retention-days: 30
