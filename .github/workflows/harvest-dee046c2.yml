name: Research harvest dee046c2 (non-publishing)

# The authoring sandbox reaches GitHub and package registries only, so the real,
# unmodified refresh plus this session's independent dated re-read run on the
# runner and their raw results are committed to this branch for line-by-line
# re-checking. This workflow never publishes to Pages and never deploys;
# publication stays with pages.yml on main. It runs ONLY via workflow_dispatch
# so an ordinary code or board commit cannot race the live site.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-dee046c2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/harvest-dee046c2/logs runtime
      - name: Real refresh of the official sources (production code, unmodified)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-dee046c2/logs/refresh.txt
      - name: Withhold any row the independent audit cannot reproduce
        continue-on-error: true
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-dee046c2/logs/quarantine.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output research/harvest-dee046c2/row-audit.md 2>&1 | tee research/harvest-dee046c2/logs/row-audit.txt
      - name: Session probe (dated third-channel re-read of every open row's primary sources)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.probe_dee046c2 --snapshot runtime/latest.json 2>&1 | tee research/harvest-dee046c2/logs/probe.txt
      - name: Copy the refreshed snapshot for review
        run: cp runtime/latest.json research/harvest-dee046c2/snapshot.json
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-dee046c2
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest dee046c2 from run ${GITHUB_RUN_ID} (no publication)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-dee046c2-${{ github.run_id }}
          path: |
            research/harvest-dee046c2
            runtime/latest.json
          retention-days: 7
