name: Research harvest (non-publishing)

# The authoring environment reaches GitHub and package registries only, so the
# real, unmodified refresh plus its independent audit run here and the raw
# result is committed for line-by-line re-checking. This workflow never
# publishes to Pages and never deploys: publication stays with pages.yml on main.

on:
  push:
    branches: [arena/d3af051a-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directory
        run: mkdir -p research/harvest/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest/logs/refresh.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md 2>&1 | tee research/harvest/logs/row-audit.txt
      - name: Build and validate exactly as publication does
        continue-on-error: true
        run: |
          python -m scripts.build --data runtime/latest.json 2>&1 | tee research/harvest/logs/build.txt
          python -m scripts.validate --data runtime/latest.json 2>&1 | tee research/harvest/logs/validate.txt
      - name: Independent row audit of the built artifact
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py public/data/latest.json --output runtime/published-row-audit.md 2>&1 | tee research/harvest/logs/published-row-audit.txt
      - name: Assemble the harvest
        run: python -m scripts.harvest --runtime runtime/latest.json --output research/harvest
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest snapshot from run ${GITHUB_RUN_ID} (no publication)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
