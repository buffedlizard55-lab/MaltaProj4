name: Research harvest 96ea1af8 (non-publishing)

# The authoring sandbox reaches GitHub and package registries only, so the real,
# unmodified refresh plus this session's coverage probe run here and their raw
# results are committed for line-by-line re-checking. This workflow never
# publishes to Pages and never deploys; publication stays with pages.yml on main.

on:
  push:
    branches: [arena/96ea1af8-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-96ea1af8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/harvest-96ea1af8/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-96ea1af8/logs/refresh.txt
      - name: Withhold any row the independent audit cannot reproduce
        continue-on-error: true
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-96ea1af8/logs/quarantine.txt
      - name: Coverage probe (why each open row has no pick / no percentage)
        continue-on-error: true
        run: python -m scripts.gap_probe_8c8e3c5f --snapshot runtime/latest.json --output research/harvest-96ea1af8/gaps.json 2>&1 | tee research/harvest-96ea1af8/logs/gaps.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output research/harvest-96ea1af8/row-audit.md 2>&1 | tee research/harvest-96ea1af8/logs/row-audit.txt
      - name: Probe HLTV markup for teams with no match page and for the betting table
        continue-on-error: true
        run: |
          mkdir -p research/harvest-96ea1af8/hltv-probe
          python - <<'PY'
          import json, pathlib, requests
          out = pathlib.Path('research/harvest-96ea1af8/hltv-probe')
          s = requests.Session()
          s.headers['User-Agent'] = 'Hotspawn-CS2-Research/1.0 (+https://github.com/buffedlizard55-lab/MaltaProj4)'
          targets = {
            'search-benched-gods': 'https://www.hltv.org/search?query=benched+gods',
            'search-titanflow': 'https://www.hltv.org/search?query=TitanFlow',
            'team-benched-gods': 'https://www.hltv.org/team/13599/benched-gods',
            'match-2399697': 'https://www.hltv.org/matches/2399697/donstu-vs-banda-chuya-cct-2026-challengers-europe-series-8',
            'match-2399889': 'https://www.hltv.org/matches/2399889/nexvoid-vs-alter-ego-dfrag-invitational-2026',
            'match-2399438': 'https://www.hltv.org/matches/2399438/1win-vs-5star-gluck-moscow-cyber-games-2026',
          }
          log = {}
          for name, url in targets.items():
            try:
              r = s.get(url, timeout=(10, 30))
              (out / (name + '.html')).write_bytes(r.content)
              log[name] = {'url': url, 'status': r.status_code, 'bytes': len(r.content)}
            except Exception as e:
              log[name] = {'url': url, 'error': str(e)[:200]}
          (out / 'probe.json').write_text(json.dumps(log, indent=2) + '\n')
          print(json.dumps(log, indent=2))
          PY
      - name: Copy the refreshed snapshot for review
        run: cp runtime/latest.json research/harvest-96ea1af8/snapshot.json
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-96ea1af8
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest 96ea1af8 from run ${GITHUB_RUN_ID} (no publication)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-96ea1af8-${{ github.run_id }}
          path: |
            research/harvest-96ea1af8
            runtime/latest.json
          retention-days: 7
