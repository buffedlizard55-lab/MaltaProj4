name: Independent CS2 source and mobile verification
on:
  push:
    branches: [main, arena/e3fe9518-maltaproj4]
    paths:
      - '.github/workflows/verification-e3fe9518.yml'
      - 'scripts/audit_e3fe9518.py'
      - 'scripts/build.py'
      - 'scripts/core.py'
      - 'scripts/validate.py'
      - 'site/assets/**'
      - 'data/latest.json'
      - 'data/identities.json'
      - 'data/review-notes.json'
      - 'tests/**'
      - 'verification-e3fe9518/**'
      - 'tests/test_session_e3fe9518.py'
      - 'tests/browser_e3fe9518.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verification-e3fe9518.yml'
      - 'scripts/audit_e3fe9518.py'
      - 'scripts/build.py'
      - 'scripts/core.py'
      - 'scripts/validate.py'
      - 'site/assets/**'
      - 'data/latest.json'
      - 'data/identities.json'
      - 'data/review-notes.json'
      - 'tests/**'
      - 'verification-e3fe9518/**'
      - 'tests/test_session_e3fe9518.py'
      - 'tests/browser_e3fe9518.cjs'
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-source-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Replay evidence, receipt graph, and source authority negatives
        run: |
          python -m unittest tests.test_session_e3fe9518 -v
          python -m scripts.audit_e3fe9518 --out runtime/verification-e3fe9518/committed
      - name: Verify canonical site, internal links, and every mobile pick
        run: |
          python -m scripts.build
          python -m scripts.validate
          node tests/browser_e3fe9518.cjs
          cp runtime/browser-e3fe9518.json runtime/verification-e3fe9518/canonical-mobile.json
          CANONICAL_OFFSET_MINUTES=120 node tests/browser_e3fe9518.cjs
          cp runtime/browser-e3fe9518.json runtime/verification-e3fe9518/canonical-overdue-mobile.json
      - name: Verify actual public files and recheck captured operator inputs
        # PRs stay offline, like the primary publication workflow. This job is
        # read-only: no source refresh, pick changes, credentials, or git writes.
        if: github.event_name != 'pull_request'
        run: python verification-e3fe9518/live_check.py
      - name: Verify the live mobile page at the actual device clock
        if: github.event_name != 'pull_request' && (success() || failure())
        env:
          SITE: https://buffedlizard55-lab.github.io/MaltaProj4/
          VERIFY_LIVE: '1'
        run: |
          node tests/browser_e3fe9518.cjs
          cp runtime/browser-e3fe9518.json runtime/verification-e3fe9518/live-mobile.json
      - name: Retain read-only verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-source-review-${{ github.run_id }}
          path: |
            runtime/verification-e3fe9518/
            runtime/browser-e3fe9518.json
          retention-days: 30
