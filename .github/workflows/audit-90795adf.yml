name: Source audit 90795adf (non-publishing)
on:
  push:
    branches: [arena/90795adf-maltaproj4]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[source-audit]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p research/session-90795adf runtime
          cp data/latest.json runtime/latest.json
          python -m scripts.refresh --output runtime/latest.json
          python -m scripts.quarantine runtime/latest.json
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md
          python -m scripts.harvest --runtime runtime/latest.json --output research/session-90795adf
          python -m scripts.probe_621776e4 --snapshot runtime/latest.json --output research/session-90795adf/probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve sourced receipts on the session branch only
        run: |
          git config user.name "source-audit-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/session-90795adf
          git commit -m "audit: retain dated source reads and row verification [skip ci]"
          git pull --rebase origin arena/90795adf-maltaproj4
          git push origin arena/90795adf-maltaproj4
