name: Research harvest a54996e1 (non-publishing)
on:
  push:
    branches: [arena/a54996e1-maltaproj4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harvest-a54996e1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/session-a54996e1/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/session-a54996e1/logs/refresh.txt
      - name: Withhold any row the independent audit cannot reproduce
        continue-on-error: true
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/session-a54996e1/logs/quarantine.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md 2>&1 | tee research/session-a54996e1/logs/row-audit.txt
      - name: Live-evidence probe (Polymarket, Pinnacle, HLTV, esportsbooks)
        continue-on-error: true
        run: python -m scripts.probe_621776e4 --snapshot runtime/latest.json --output research/session-a54996e1/probe 2>&1 | tee research/session-a54996e1/logs/probe.txt
      - name: Copy the refreshed snapshot and audit for review
        run: |
          if [ -s runtime/latest.json ]; then cp runtime/latest.json research/session-a54996e1/snapshot.json; fi
          if [ -s runtime/row-audit.md ]; then cp runtime/row-audit.md research/session-a54996e1/row-audit.md; fi
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/session-a54996e1
          if git diff --cached --quiet; then echo "No harvest change to commit."; exit 0; fi
          git commit -m "Research harvest a54996e1 from run ${GITHUB_RUN_ID} (no publication) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-a54996e1-${{ github.run_id }}
          path: |
            research/session-a54996e1
            runtime/latest.json
          retention-days: 7
