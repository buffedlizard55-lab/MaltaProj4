name: Diag f2e04d1a (non-publishing)

# Reproduces, on a genuinely fresh Hotspawn snapshot, the exact step that has been
# failing every scheduled publish since 2026-10-24T09:03Z:
#
#   Keep the legacy main:/ root fallback on the verified build ... rc=3
#
# rc=3 is the guard's own "the staged root failed its own validator or unit gate"
# branch, so the evidence needed is the *name* of the check that fails on fresh
# data, not on the committed snapshot (which is green locally). This workflow
# never deploys, never commits a root, and never changes a pick. It writes one
# log file under research/session-f2e04d1a/ so the failure text is readable from
# the repository rather than from an Actions log endpoint.
on:
  push:
    branches: [arena/f2e04d1a-maltaproj4]
    paths-ignore:
      - 'research/session-f2e04d1a/**'
      - 'COORDINATION.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag-f2e04d1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh official sources to a fresh snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime research/session-f2e04d1a
          set +e
          python -m scripts.refresh --output runtime/latest.json > runtime/refresh.log 2>&1
          echo "refresh_rc=$?" | tee -a runtime/diag.env
          set -e
          cp data/latest.json runtime/committed-latest.json
          tail -c 4000 runtime/refresh.log > research/session-f2e04d1a/refresh-tail-${{ github.run_id }}.txt || true

      - name: Quarantine and build exactly as the publisher does
        run: |
          set +e
          python -m scripts.quarantine runtime/latest.json > runtime/quarantine.log 2>&1
          echo "quarantine_rc=$?" >> runtime/diag.env
          python -m scripts.build --data runtime/latest.json > runtime/build.log 2>&1
          echo "build_rc=$?" >> runtime/diag.env
          set -e

      - name: "Reproduce the failing gate: validate the staged root"
        run: |
          set +e
          python -m scripts.publish_root_fallback --public public --root . --cooldown-hours 0.2 > runtime/publish.log 2>&1
          echo "publish_rc=$?" >> runtime/diag.env
          git status --porcelain -- 404.html analysis.html assets build-info.json data/latest.json data/matches.csv evidence.html index.html matches.html methodology.html picks.html review.html site sources.html unresolved.html .nojekyll > runtime/staged-files.txt
          python -m scripts.validate --data data/latest.json --site . > runtime/validate.log 2>&1
          echo "validate_rc=$?" >> runtime/diag.env
          set -e

      - name: "Reproduce the failing gate: unit suite on the fresh snapshot"
        run: |
          set +e
          python -m unittest discover -s tests > runtime/unittest.log 2>&1
          echo "unittest_rc=$?" >> runtime/diag.env
          set -e

      - name: Publish the measurement as annotations
        if: always()
        run: |
          cat runtime/diag.env || true
          echo "--- validate failures ---"
          grep -E "FAIL|ERROR|Traceback|line [0-9]+" runtime/validate.log | head -40 || true
          echo "--- unittest failures ---"
          grep -E "^(FAIL|ERROR):" runtime/unittest.log | head -40 || true
          {
            echo "diag:"
            grep -E "_rc=" runtime/diag.env || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the measurement so it survives the log endpoint
        if: always()
        run: |
          {
            echo "# Diag f2e04d1a run ${{ github.run_id }} (${{ github.event_name }})"
            echo
            echo "commit: ${{ github.sha }}"
            echo
            echo '```'
            grep -E "_rc=" runtime/diag.env || echo "no rc recorded"
            echo '```'
            echo
            echo "## committed snapshot vs fresh snapshot"
            python - <<'PY'
            import json
            def stats(p, tag):
                try:
                    d = json.load(open(p))
                except Exception as e:
                    return f"{tag}: unreadable ({e})"
                rows = d.get('matches') or []
                op = [m for m in rows if m.get('state') == 'open']
                return (f"{tag}: generated_at={d.get('generated_at')} rows={len(rows)} open={len(op)} "
                        f"picks={sum(bool(m.get('pick')) for m in op)} "
                        f"priced={sum(m.get('probabilities') is not None for m in op)} "
                        f"unresolved={sum(m.get('probabilities') is None for m in op)}")
            print(stats('runtime/committed-latest.json', 'committed'))
            print(stats('runtime/latest.json', 'fresh'))
            try:
                d = json.load(open('runtime/latest.json'))
                op = [m for m in d.get('matches') or [] if m.get('state') == 'open']
                for m in op:
                    if m.get('probabilities') is None:
                        print(f"  unresolved {m.get('id')} {m.get('teams')} pick={m.get('pick')!r} method={m.get('method')!r}")
            except Exception as e:
                print('fresh snapshot unreadable', e)
            PY
            echo
            echo "## staged files"
            echo '```'
            cat runtime/staged-files.txt 2>/dev/null || echo 'none'
            echo '```'
            echo
            echo "## validate.log (tail)"
            echo '```'
            tail -c 20000 runtime/validate.log 2>/dev/null || echo 'missing'
            echo '```'
            echo
            echo "## unittest.log: failing tests"
            echo '```'
            grep -E "^(FAIL|ERROR):" runtime/unittest.log 2>/dev/null | head -60 || echo 'none'
            echo '```'
            echo
            echo "## unittest.log (tail)"
            echo '```'
            tail -c 20000 runtime/unittest.log 2>/dev/null || echo 'missing'
            echo '```'
            echo
            echo "## refresh.log (tail)"
            echo '```'
            tail -c 6000 runtime/refresh.log 2>/dev/null || echo 'missing'
            echo '```'
          } > "research/session-f2e04d1a/diag-${{ github.run_id }}.md"
          git config user.name "cs2-scout-publisher"
          git config user.email "cs2-scout-publisher@users.noreply.github.com"
          git add "research/session-f2e04d1a/diag-${{ github.run_id }}.md"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && \
              git push origin "HEAD:refs/heads/${{ github.ref_name }}" && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push the diagnostic report; it is still in the job summary and annotations."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diag-${{ github.run_id }}
          path: |
            runtime/
            research/session-f2e04d1a/
          retention-days: 7
