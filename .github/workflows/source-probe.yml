name: Source diagnostics
on:
  push:
    branches: [arena/3af9ea7d-maltaproj4]
    paths: [.github/workflows/source-probe.yml]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public source responses
        shell: bash
        run: |
          mkdir evidence
          for entry in 'hotspawn|https://play.hotspawn.com/cs2-pickems' 'hltv|https://www.hltv.org/matches' 'ggbet|https://gg.bet/en/esports/counter-strike' 'thunderpick|https://thunderpick.io/esports/cs2' 'pinnacle|https://www.pinnacle.com/en/esports/games/cs2' 'polymarket|https://gamma-api.polymarket.com/sports'; do
            name="${entry%%|*}"; url="${entry#*|}"
            curl -L --max-time 45 -A 'Mozilla/5.0 (compatible; HotspawnResearch/1.0)' -D "evidence/$name.headers" "$url" -o "evidence/$name.html" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: source-diagnostics
          path: evidence
          retention-days: 7
      - name: Save diagnostic evidence on session branch
        if: github.ref == 'refs/heads/arena/3af9ea7d-maltaproj4'
        run: |
          mkdir -p data/diagnostics
          cp evidence/* data/diagnostics/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/diagnostics
          git diff --cached --quiet && exit 0
          git commit -m "data: capture public source diagnostic responses"
          git pull --rebase origin arena/3af9ea7d-maltaproj4
          git push origin arena/3af9ea7d-maltaproj4
