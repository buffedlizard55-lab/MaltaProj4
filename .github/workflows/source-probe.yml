name: Integration source research
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integration-source-research
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/c4d25599-maltaproj4'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m scripts.refresh --output research/current/refresh.json
      - run: python -m scripts.research_current
      - name: Preserve compact evidence on this session branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/current
          git diff --cached --quiet && exit 0
          git commit -m 'research: capture current official-source evidence for integration'
          git pull --rebase origin arena/c4d25599-maltaproj4
          git push origin arena/c4d25599-maltaproj4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-research-${{ github.run_id }}
          path: runtime/
          retention-days: 7
