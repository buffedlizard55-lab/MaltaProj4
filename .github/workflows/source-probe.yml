name: Source connectivity research
on:
  workflow_dispatch:
  push:
    branches: [arena/66b553de-maltaproj4]
    paths: [.github/workflows/source-probe.yml, scripts/probe_extra.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m scripts.probe_extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-research
          path: runtime/
          retention-days: 7
