name: Source connectivity research
on:
  push:
    branches: [arena/ee1fb536-maltaproj4]
    paths: [.github/workflows/source-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.refresh --output data/latest.json
      - run: pip install playwright==1.58.0 && playwright install --with-deps chromium
      - run: python -m scripts.inspect_sources
      - name: Retain public HTML for fallback adapter research
        run: |
          mkdir -p research/probe
          python - <<'PY'
          import json, pathlib
          for row in json.loads(pathlib.Path('data/latest.json').read_text())['source_checks']:
            if row['status'] == 'ok' and row['name'] in ['HLTV fallback discovery','Thunderpick fallback access']:
              p = pathlib.Path('runtime/sources',row['sha256']+'.html')
              pathlib.Path('research/probe',row['name'].split()[0].lower()+'.txt').write_bytes(p.read_bytes())
          PY
      - name: Preserve verified initial snapshot on session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          for f in research/probe/hltv*.txt research/probe/thunderpick*.txt research/probe/thunderpick-api.json; do
            if test -f "$f"; then git add -f "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'data: preserve verified initial match and external-line snapshot'
          git pull --rebase origin arena/ee1fb536-maltaproj4
          git push origin HEAD:arena/ee1fb536-maltaproj4
