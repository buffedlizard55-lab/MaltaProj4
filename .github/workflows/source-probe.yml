name: Source access probe
on:
  push:
    branches: [arena/c6e9f285-maltaproj4]
    paths: [.github/workflows/source-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright && npx playwright install --with-deps chromium
      - name: Inspect public sources
        run: |
          mkdir -p probe
          cat > probe.cjs <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs');
          (async()=>{const browser=await chromium.launch();const context=await browser.newContext({timezoneId:'UTC'});const page=await context.newPage();let i=0;const pending=[];
          page.on('response',res=>{if(/hotspawn|cloudways/.test(res.url())&&/json/.test(res.headers()['content-type']||'')){pending.push((async()=>{try{const body=await res.text();fs.writeFileSync(`probe/api-${++i}.json`,JSON.stringify({url:res.url(),body}));}catch{}})());}});
          for(const [name,url] of [['hotspawn','https://play.hotspawn.com/lobby'],['hltv','https://www.hltv.org/matches'],['bo3','https://bo3.gg/matches/current'],['ggbet','https://gg.bet/en/esports/counter-strike'],['thunderpick','https://thunderpick.io/esports/cs2']]){try{await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(10000);fs.writeFileSync(`probe/${name}.html`,await page.content());fs.writeFileSync(`probe/${name}.txt`,await page.locator('body').innerText());console.log(name,page.url());}catch(e){console.log(name,e.message());}}
          await Promise.allSettled(pending);await browser.close();})();
          JS
          node probe.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: source-probe
          path: probe/
          retention-days: 3
