name: One-off source probe (session b6199335)
on:
  push:
    branches: [arena/b6199335-maltaproj4]
    paths: ['research/session-b6199335/PROBE-TRIGGER.md']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture raw source responses
        run: |
          mkdir -p research/session-b6199335/raw
          cap () {  # cap <name> <url>
            code=$(curl -sS -L --max-time 40 -A "Mozilla/5.0 (compatible; cs2-scout-probe/1.0)" \
              -o "research/session-b6199335/raw/$1.body" -w '%{http_code}' "$2" || echo 000)
            printf '{"name":"%s","url":"%s","http_status":%s,"bytes":%s,"captured_at":"%s"}\n' \
              "$1" "$2" "$code" "$(stat -c%s "research/session-b6199335/raw/$1.body" 2>/dev/null || echo 0)" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> research/session-b6199335/raw/index.jsonl
          }
          cap thunderpick_cs2 'https://thunderpick.io/esports/cs2-betting'
          cap thunderpick_nodwin 'https://thunderpick.io/esports/cs2-betting/nodwin-clutch-series-13/11384'
          cap gg_bet_cs2 'https://gg.bet/en/esports/counter-strike'
          cap hltv_matches 'https://www.hltv.org/matches'
          cap hltv_betting 'https://www.hltv.org/betting'
          cap hotspawn_lobby 'https://play.hotspawn.com/lobby'
          cap hotspawn_api 'https://phpstack-1372681-6459848.cloudwaysapps.com/api/v1/fixtures?sport_alias=cs2&status=scheduled&tenantId=1'
          cat research/session-b6199335/raw/index.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-b6199335
          path: research/session-b6199335/raw/
          retention-days: 7
