name: Coverage evidence ac4743a3 (non-publishing)

# Authoring bash is network-restricted. Use the real collector on a runner,
# retain the exact official-source bytes, and return a compact, dated receipt.
# Only this session's fixed branch can receive commits; this never deploys.
on:
  push:
    branches: [arena/ac4743a3-maltaproj4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coverage-evidence-ac4743a3
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/arena/ac4743a3-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official sources, withhold non-reproducible rows, audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/session-ac4743a3/capture
          python -m scripts.refresh --output runtime/latest.json
          python -m scripts.quarantine runtime/latest.json
          python verification-c6/audit_snapshot.py runtime/latest.json --output research/session-ac4743a3/capture/row-audit.md
          python -m scripts.probe_ac4743a3
      - name: Return exact evidence on the fixed session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/session-ac4743a3/capture
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retain official-source evidence from run ${GITHUB_RUN_ID} (no publication)"
          git pull --rebase origin arena/ac4743a3-maltaproj4
          git push origin arena/ac4743a3-maltaproj4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-evidence-ac4743a3-${{ github.run_id }}
          path: research/session-ac4743a3/capture
          retention-days: 7
