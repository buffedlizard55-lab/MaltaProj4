name: Research harvest 7271c5d5 (non-publishing)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7271c5d5-maltaproj4

permissions:
  contents: write

concurrency:
  group: harvest-7271c5d5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Capture live primary-source evidence and run full 97-row audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/probe_7271c5d5.py
          python -m scripts.quarantine research/harvest-7271c5d5/snapshot.json
          python -m scripts.build --data research/harvest-7271c5d5/snapshot.json --out runtime_site
          python -m scripts.validate --data research/harvest-7271c5d5/snapshot.json --out runtime_site
          python verification-7271c5d5/audit_board_7271c5d5.py \
            --snapshot research/harvest-7271c5d5/snapshot.json \
            --site-dir runtime_site \
            --write-markdown research/harvest-7271c5d5/LIVE-97-ROW-AUDIT.md
      - name: Commit harvest receipts back to working branch (never main, no Pages deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/harvest-7271c5d5/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Research harvest 7271c5d5 from run ${{ github.run_id }} (no publication) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
