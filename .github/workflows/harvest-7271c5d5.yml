name: Research harvest 7271c5d5 (non-publishing)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7271c5d5-maltaproj4

permissions:
  contents: write

concurrency:
  group: harvest-7271c5d5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install beautifulsoup4 pytest
      - name: Capture live primary-source evidence and run c6 snapshot audit
        run: python scripts/probe_7271c5d5.py
      - name: Commit harvest receipts back to working branch (never main, no Pages deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/harvest-7271c5d5/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Research harvest 7271c5d5 from run ${{ github.run_id }} (no publication) [skip ci]"
          git pull --rebase origin arena/7271c5d5-maltaproj4
          git push origin HEAD:arena/7271c5d5-maltaproj4
