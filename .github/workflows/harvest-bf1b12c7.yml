name: Live coverage harvest bf1b12c7 (non-publishing)

# A real refresh on a normal GitHub egress (this sandbox cannot reach Hotspawn,
# HLTV, Polymarket, Pinnacle or the bookmakers at all), followed by the
# production build, the independent evidence replay, the validator and the
# phone/browser gates. Only dated research receipts are committed here; this
# workflow never deploys Pages and never pushes a generated board to main.
on:
  push:
    branches: [arena/bf1b12c7-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-harvest-bf1b12c7
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/arena/bf1b12c7-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Verify the committed board before touching any source
        run: |
          mkdir -p research/harvest-bf1b12c7
          python -m unittest discover -s tests 2>&1 | tee research/harvest-bf1b12c7/pre-refresh-unit.log | tail -5
          python -m unittest discover -s audits -p 'test_*.py'
          python verification-95b588c2/test_integrity.py
          python -m unittest discover -s verification-c6 -p 'test_*.py'
          python -m scripts.validate --data data/latest.json --site .
      - name: Refresh official Hotspawn, HLTV, exchange, bookmaker and Valve sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime research/harvest-bf1b12c7
          python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-bf1b12c7/refresh.log
      - name: Quarantine any row the independent evidence replay cannot reproduce
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-bf1b12c7/quarantine.log
      - name: Independently audit every refreshed row
        run: |
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/independent-row-audit.md
          cp runtime/independent-row-audit.md research/harvest-bf1b12c7/independent-row-audit.md
          cp runtime/latest.json research/harvest-bf1b12c7/snapshot.json
      - name: Coverage receipt for this exact capture
        run: python -m scripts.audit_e334b970 --snapshot research/harvest-bf1b12c7/snapshot.json --output research/harvest-bf1b12c7
      - name: Build and validate the fresh candidate
        run: |
          python -m scripts.build --data runtime/latest.json
          python -m scripts.validate --data runtime/latest.json
          python verification-c6/audit_snapshot.py public/data/latest.json --output research/harvest-bf1b12c7/published-row-audit.md
          cp public/build-info.json research/harvest-bf1b12c7/build-info.json
      - name: Do the committed unit and validate suites survive this fresh snapshot?
        # Diagnostic, not a gate. It reproduces what pages.yml's
        # "Keep the legacy main:/ root fallback on the verified build" step does
        # after a refresh: build the fresh snapshot, copy the verified build over
        # the committed root (scripts.publish_root_fallback, as pages.yml does), then run the same commands
        # that step runs -- `scripts.validate` and the unit suite. An earlier
        # version of this step copied only the raw refresh JSON, which has no
        # `built_at` and does not regenerate data/matches.csv, so it reported
        # failures that the real publisher never sees. Everything is restored
        # afterwards with `git checkout -- .` so no generated file is committed.
        continue-on-error: true
        run: |
          LOG=runtime/rehearsal.log
          {
            echo "# Fresh-snapshot publisher rehearsal"
            echo
            echo "Snapshot: $(python -c 'import json;print(json.load(open("research/harvest-bf1b12c7/snapshot.json"))["generated_at"])')"
            echo "Commands: scripts.build -> scripts.publish_root_fallback -> scripts.validate -> unittest discover -s tests (pages.yml publish())"
            echo
          } > "$LOG"
          # Exactly pages.yml's publish(): the verified public/ build from the
          # previous step is promoted by scripts.publish_root_fallback (same
          # cooldown flag), then the same validator and unit suite run on it.
          echo '## scripts.publish_root_fallback' >> "$LOG"
          python -m scripts.publish_root_fallback --public public --root . --cooldown-hours 0.2 >> "$LOG" 2>&1 || echo 'PUBLISH_ROOT_FALLBACK REFUSED/FAILED' >> "$LOG"
          echo '## scripts.validate' >> "$LOG"
          python -m scripts.validate --data data/latest.json --site . >> "$LOG" 2>&1 || echo 'VALIDATE FAILED' >> "$LOG"
          echo '## unittest discover -s tests' >> "$LOG"
          python -m unittest discover -s tests -v >> "$LOG" 2>&1 || echo 'UNIT SUITE FAILED' >> "$LOG"
          tail -40 "$LOG"
          grep -E '^(FAIL|ERROR):|^Ran |^OK|^FAILED|FAILED$|REFUSED' "$LOG" > runtime/rehearsal-summary.txt || true
          cp runtime/rehearsal-summary.txt research/harvest-bf1b12c7/rehearsal-summary.txt
          # Restore every generated file the rehearsal touched. The log itself
          # must be copied AFTER this, or `git checkout -- .` reverts it too
          # (that is exactly what happened on run 40087400028, whose rehearsal
          # output was silently discarded).
          cp "$LOG" research/harvest-bf1b12c7/post-refresh-unit.log
          # Exclude this session's whole receipt folder: on run 40112589540 a
          # per-file exclusion restored the PREVIOUS run's committed snapshot and
          # coverage receipt over the fresh ones, so only the logs advanced.
          git checkout -- . ':(exclude)research/harvest-bf1b12c7'
          git clean -fdq -- assets site data ':(exclude)research' || true
      - name: Phone, desktop, accessibility and exact expiry checks on the fresh candidate
        continue-on-error: true
        run: npm run test:browser 2>&1 | tee research/harvest-bf1b12c7/browser.log | tail -30
      - name: Record runner identity without changing source timestamps
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'workflow_run_id': os.environ['RUN_ID'], 'attempt': os.environ['RUN_ATTEMPT'],
                     'checkout_sha': os.environ['RUN_SHA'], 'run_url': os.environ['RUN_URL'],
                     'publishes_pages': False, 'snapshot': 'research/harvest-bf1b12c7/snapshot.json'}
          Path('research/harvest-bf1b12c7/run.json').write_text(json.dumps(receipt, indent=1) + '\n')
          PY
      - name: Commit only the dated research receipts to the fixed session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research/harvest-bf1b12c7
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retain live coverage harvest from run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin arena/bf1b12c7-maltaproj4
          git push origin arena/bf1b12c7-maltaproj4
      - name: Retain candidate and audit artifacts even when a gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-harvest-bf1b12c7-${{ github.run_id }}
          path: |
            research/harvest-bf1b12c7
            runtime/latest.json
            runtime/independent-row-audit.md
            public/build-info.json
          retention-days: 14
