name: Final coverage harvest 9b97d585 (non-publishing)

# A real refresh on a normal GitHub egress, followed by the production build,
# independent evidence replay, validator and phone/browser gates.  Only dated
# research receipts are committed; this workflow never deploys Pages and never
# pushes a generated board directly to main.
on:
  push:
    branches: [arena/9b97d585-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-harvest-9b97d585
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/arena/9b97d585-maltaproj4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Verify the committed board before touching any source
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s audits -p 'test_*.py'
          python verification-95b588c2/test_integrity.py
          python -m unittest discover -s verification-c6 -p 'test_*.py'
          python -m scripts.validate --data data/latest.json --site .
      - name: Refresh official Hotspawn, HLTV, exchange, book and Valve sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime research/harvest-9b97d585
          python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-9b97d585/refresh.log
      - name: Quarantine any row the independent evidence replay cannot reproduce
        run: python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-9b97d585/quarantine.log
      - name: Independently audit every refreshed row
        run: |
          python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/independent-row-audit.md
          python -m scripts.audit_9b97d585 --snapshot runtime/latest.json --previous data/latest.json --output research/harvest-9b97d585
          cp runtime/independent-row-audit.md research/harvest-9b97d585/independent-row-audit.md
      - name: Build and validate the fresh candidate
        run: |
          python -m scripts.build --data runtime/latest.json
          python -m scripts.validate --data runtime/latest.json
          python verification-c6/audit_snapshot.py public/data/latest.json --output research/harvest-9b97d585/published-row-audit.md
      - name: Phone, desktop, accessibility and exact expiry checks
        run: npm run test:browser 2>&1 | tee research/harvest-9b97d585/browser.log
      - name: Record runner identity without changing source timestamps
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'workflow_run_id': os.environ['RUN_ID'], 'attempt': os.environ['RUN_ATTEMPT'],
                     'checkout_sha': os.environ['RUN_SHA'], 'run_url': os.environ['RUN_URL'],
                     'publishes_pages': False, 'snapshot': 'research/harvest-9b97d585/snapshot.json'}
          Path('research/harvest-9b97d585/run.json').write_text(json.dumps(receipt, indent=1) + '\n')
          PY
      - name: Commit only the dated research receipts to the fixed session branch
        run: |
          git config user.name "cs2-evidence-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/harvest-9b97d585
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retain final coverage harvest from run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin arena/9b97d585-maltaproj4
          git push origin arena/9b97d585-maltaproj4
      - name: Retain candidate and audit artifacts even when a gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-harvest-9b97d585-${{ github.run_id }}
          path: |
            research/harvest-9b97d585
            runtime/latest.json
            runtime/independent-row-audit.md
            public/build-info.json
          retention-days: 14
