name: Publication diagnostics 5457d33a
on:
  push:
    branches: [arena/5457d33a-maltaproj4]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preserve failed browser log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/session-5457d33a
          gh run view 39081708156 --log-failed > research/session-5457d33a/deploy-failure.txt
          git config user.name harvest-runner
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/session-5457d33a/deploy-failure.txt
          git commit -m 'Preserve failed browser diagnosis [skip ci]'
          git pull --rebase origin arena/5457d33a-maltaproj4
          git push origin arena/5457d33a-maltaproj4
