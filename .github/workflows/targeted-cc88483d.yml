name: Targeted source verification cc88483d
on:
  push:
    branches: [arena/cc88483d-maltaproj4]
permissions:
  contents: write
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[targeted]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m scripts.day5_cc88483d targeted
      - run: |
          git config user.name 'source-verification-runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/session-cc88483d/targeted
          git diff --cached --quiet && exit 0
          git commit -m 'Retain targeted API verification cc88483d [skip ci]'
          git pull --rebase origin arena/cc88483d-maltaproj4
          git push origin arena/cc88483d-maltaproj4
