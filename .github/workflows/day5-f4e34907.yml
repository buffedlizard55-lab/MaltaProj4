name: Day-five verification f4e34907
on:
  push:
    branches: [arena/f4e34907-maltaproj4]
permissions:
  contents: read
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[day5-capture]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p runtime research/session-f4e34907
          cp data/latest.json runtime/latest.json
          python -m scripts.refresh --output runtime/latest.json
          python -m scripts.quarantine runtime/latest.json
          python verification-c6/audit_snapshot.py runtime/latest.json --output research/session-f4e34907/row-audit.md
          cp runtime/latest.json research/session-f4e34907/snapshot.json
          python -m scripts.probe_621776e4 --snapshot runtime/latest.json --output research/session-f4e34907/probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: day5-source-evidence
          path: research/session-f4e34907/
  retain:
    if: contains(github.event.head_commit.message, '[retain-day5]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retain completed capture on this session branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39066005984 -n day5-source-evidence -D research/session-f4e34907
          git config user.name source-evidence-runner
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/session-f4e34907
          git commit -m "research: retain day-five source capture [skip ci]"
          git pull --rebase origin arena/f4e34907-maltaproj4
          git push origin arena/f4e34907-maltaproj4
