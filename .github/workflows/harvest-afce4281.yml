name: Research harvest afce4281 (non-publishing)

# The authoring sandbox reaches GitHub and package registries only, so the real,
# unmodified refresh plus this session's gap probe run here and their raw results
# are committed for line-by-line re-checking. This workflow never publishes to
# Pages and never deploys; publication stays with pages.yml on main.

on:
  push:
    branches: [arena/afce4281-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-afce4281-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/harvest-afce4281/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh --output runtime/latest.json 2>&1 | tee research/harvest-afce4281/logs/refresh.txt
      - name: Gap probe (why each open row has no pick / no percentage)
        continue-on-error: true
        run: python -m scripts.gap_probe_afce4281 --snapshot runtime/latest.json --output research/harvest-afce4281/gaps.json 2>&1 | tee research/harvest-afce4281/logs/gaps.txt
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: python verification-c6/audit_snapshot.py runtime/latest.json --output runtime/row-audit.md 2>&1 | tee research/harvest-afce4281/logs/row-audit.txt
      - name: Copy the refreshed snapshot for review
        run: cp runtime/latest.json research/harvest-afce4281/snapshot.json
      - name: Commit harvest (no publication)
        run: |
          git config user.name "harvest-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-afce4281
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest afce4281 from run ${GITHUB_RUN_ID} (no publication)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-afce4281-${{ github.run_id }}
          path: |
            research/harvest-afce4281
            runtime/latest.json
            runtime/row-audit.md
          retention-days: 7
