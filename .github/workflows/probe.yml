name: Source diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/d1bae160-maltaproj4]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: |
          mkdir -p diagnostics
          python scripts/browser_check.py > diagnostics/browser.txt 2>&1
        continue-on-error: true
      - run: python scripts/probe.py
      - run: python scripts/collect.py
      - name: Report source diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/report_probe.py > diagnostics/report.txt
          gh pr comment 8 --body-file diagnostics/report.txt
      - run: "! grep -q Traceback diagnostics/browser.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: source-diagnostics
          path: diagnostics
