name: Research harvest f659a6e2 (non-publishing)

# Why this exists: the authoring sandbox reaches GitHub and package registries only,
# so the real, unmodified refresh plus this session's Day-5 live-evidence probe run
# here and their raw responses are committed for line-by-line re-checking. This
# workflow never publishes to Pages and never deploys; publication stays with
# pages.yml on main. Every command's real exit status is written to a file because
# `continue-on-error` would otherwise hide a failure.
#
# Added by session f659a6e2 on 2026-10-18 because Polymarket created both Sunday
# (18 October) Thunderpick World Championship markets at 2026-10-17T20:55Z - after
# the previous sessions had recorded "no exchange line for day five". Their single
# Thunderpick document reads expire 2026-10-18T04:20:54Z, so the final day needs a
# freshly retrieved, replayable line of its own.

on:
  push:
    branches: [arena/f659a6e2-maltaproj4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-f659a6e2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare harvest directories
        run: mkdir -p research/harvest-f659a6e2/logs research/session-f659a6e2/logs runtime
      - name: Real refresh of the official sources
        continue-on-error: true
        run: |
          set +e
          python -m scripts.refresh --output runtime/latest.json --previous data/latest.json 2>&1 | tee research/harvest-f659a6e2/logs/refresh.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-f659a6e2/logs/refresh.exit
      - name: Withhold any row the independent audit cannot reproduce (as production does)
        continue-on-error: true
        run: |
          set +e
          python -m scripts.quarantine runtime/latest.json 2>&1 | tee research/harvest-f659a6e2/logs/quarantine.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-f659a6e2/logs/quarantine.exit
      - name: Day-5 live-evidence probe (Polymarket moneylines, Pinnacle, HLTV, esportsbooks)
        continue-on-error: true
        run: |
          set +e
          python -m scripts.probe_f659a6e2 --snapshot runtime/latest.json --output research/harvest-f659a6e2 2>&1 | tee research/harvest-f659a6e2/logs/probe.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-f659a6e2/logs/probe.exit
      - name: Independent row audit of the refreshed snapshot
        continue-on-error: true
        run: |
          set +e
          python verification-c6/audit_snapshot.py runtime/latest.json --output research/harvest-f659a6e2/row-audit.md 2>&1 | tee research/harvest-f659a6e2/logs/row-audit.txt
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-f659a6e2/logs/row-audit.exit
      - name: Build and validate exactly as publication does (no deployment)
        continue-on-error: true
        run: |
          set +e
          python -m scripts.build --data runtime/latest.json 2>&1 | tee research/harvest-f659a6e2/logs/build.txt
          echo "build_exit=${PIPESTATUS[0]}" | tee research/harvest-f659a6e2/logs/build.exit
          python -m scripts.validate --data runtime/latest.json 2>&1 | tee research/harvest-f659a6e2/logs/validate.txt
          echo "validate_exit=${PIPESTATUS[0]}" | tee research/harvest-f659a6e2/logs/validate.exit
      - name: Retain the refreshed snapshot and a compact summary as this session's receipt
        continue-on-error: true
        run: |
          set +e
          cp runtime/latest.json research/harvest-f659a6e2/snapshot.json
          python - <<'PY' 2>&1 | tee research/harvest-f659a6e2/logs/summary.txt
          import json, pathlib
          snap = json.loads(pathlib.Path('runtime/latest.json').read_text())
          matches = snap.get('matches', [])
          open_rows = [m for m in matches if m.get('state') == 'open']
          summary = {
              'generated_at': snap.get('generated_at'),
              'fixtures_observed_at': snap.get('fixtures_observed_at'),
              'coverage': snap.get('coverage'),
              'coverage_counts': snap.get('coverage_counts'),
              'rows': len(matches),
              'open_rows': len(open_rows),
              'open_rows_with_a_pick': sum(1 for m in open_rows if m.get('pick')),
              'open_rows_with_a_percentage': sum(1 for m in open_rows if m.get('probabilities')),
              'open_rows_unresolved': [
                  {'id': m['id'], 'teams': m.get('teams'), 'competition': m.get('competition'),
                   'start': m.get('start'), 'method': m.get('method'), 'reason': m.get('reason')}
                  for m in open_rows if not m.get('pick')],
              'open_rows_pick_without_percentage': [
                  {'id': m['id'], 'teams': m.get('teams'), 'competition': m.get('competition'),
                   'start': m.get('start'), 'method': m.get('method'), 'pick': m.get('pick')}
                  for m in open_rows if m.get('pick') and not m.get('probabilities')],
              'thunderpick_rows': [
                  {'id': m['id'], 'teams': m.get('teams'), 'competition': m.get('competition'),
                   'start': m.get('start'), 'state': m.get('state'), 'tier': m.get('tier')}
                  for m in matches
                  if 'thunderpick world championship' in str(m.get('competition') or '').casefold()],
              'issues': snap.get('issues'),
          }
          pathlib.Path('research/harvest-f659a6e2/harvest-summary.json').write_text(
              json.dumps(summary, indent=2, ensure_ascii=False, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, ensure_ascii=False, sort_keys=True))
          PY
          echo "exit=${PIPESTATUS[0]}" | tee research/harvest-f659a6e2/logs/summary.exit
      - name: Commit harvest (no publication)
        if: always()
        run: |
          git config user.name "harvest-runner-f659a6e2"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/harvest-f659a6e2 research/session-f659a6e2
          if git diff --cached --quiet; then
            echo "No harvest change to commit."
            exit 0
          fi
          git commit -m "Research harvest f659a6e2 Day-5 evidence from run ${GITHUB_RUN_ID} (no publication) [harvest-skip]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harvest-f659a6e2-${{ github.run_id }}
          path: |
            research/harvest-f659a6e2
            runtime/latest.json
          retention-days: 7
